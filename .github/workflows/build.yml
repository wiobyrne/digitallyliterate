# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Check for any build error

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Check dl-home/dl-note body classes haven't been dropped by a template sync
      run: |
        if ! grep -qF "dl-home" src/site/_includes/layouts/index.njk; then
          echo "::error::src/site/_includes/layouts/index.njk is missing the 'dl-home' body class. Digital Garden template-update PRs periodically rewrite this layout's <body> tag and drop it. Over 50 rules in custom-style.scss and styles/user/010-garden-slice.scss are scoped to .dl-home/body.dl-note and silently stop applying without it. Re-add 'dl-home' to the body class list before merging."
          exit 1
        fi
        if ! grep -qF "dl-note" src/site/_includes/layouts/note.njk; then
          echo "::error::src/site/_includes/layouts/note.njk is missing the 'dl-note' body class. Digital Garden template-update PRs periodically rewrite this layout's <body> tag and drop it. Over 50 rules in custom-style.scss and styles/user/010-garden-slice.scss are scoped to .dl-home/body.dl-note and silently stop applying without it. Re-add 'dl-note' to the body class list before merging."
          exit 1
        fi
    - name: Check the custom navbar hasn't been reverted to the stock template
      run: |
        if ! grep -qF "garden-masthead" src/site/_includes/components/navbar.njk; then
          echo "::error::src/site/_includes/components/navbar.njk no longer contains 'garden-masthead'. Digital Garden template-update PRs periodically replace this file with the stock navbar, dropping the wordmark/regmark branding, Newsletter/Subscribe links, and the dark/light theme toggle. Restore the custom navbar (see git history around the v1.69.0 template update fix) before merging."
          exit 1
        fi
    - name: Check the user-owned design system is present
      run: |
        if [ ! -s src/site/styles/user/000-tokens.scss ]; then
          echo "::error::The user-owned design tokens are missing. Restore src/site/styles/user/000-tokens.scss before merging."
          exit 1
        fi
        if [ -z "$(find src/site/img/fonts -maxdepth 1 -type f -print -quit 2>/dev/null)" ]; then
          echo "::error::The user-owned font assets are missing from src/site/img/fonts."
          exit 1
        fi
    - run: npm ci
    - name: Unit tests
      run: npm test
    - name: Validate note frontmatter and publishing metadata
      run: npm run validate
    - run: npm run build --if-present
    - name: Check the build emitted the user-owned design system
      run: |
        if [ ! -s dist/styles/user/000-tokens.css ]; then
          echo "::error::The compiled design tokens are missing from dist/styles/user/000-tokens.css."
          exit 1
        fi
        if [ -z "$(find dist/img/fonts -maxdepth 1 -type f -print -quit 2>/dev/null)" ]; then
          echo "::error::The custom fonts are missing from dist/img/fonts."
          exit 1
        fi
        if [ ! -s dist/searchIndex.json ]; then
          echo "::error::The upstream search index was not generated."
          exit 1
        fi
        if [ ! -s dist/sitemap.xml ]; then
          echo "::error::The upstream sitemap was not generated."
          exit 1
        fi
